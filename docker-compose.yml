services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: virtua_fc
      POSTGRES_USER: virtua_fc
      POSTGRES_PASSWORD: password
    # Loopback-only: reachable from the host (psql, TablePlus) but not from
    # the network the machine happens to be on.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtua_fc -d virtua_fc"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Loopback-only — this Redis has no auth configured.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
